apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: aegis-app
  labels: {app.kubernetes.io/part-of: aegisshield}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        server_name _;
        location = /healthz { return 200 'ok'; }
        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $uri $uri/ /index.html;
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: aegis-app
  labels: {app.kubernetes.io/part-of: aegisshield}
data:
  index.html: |
    <!doctype html><html><head><title>AegisShield</title></head>
    <body><h1>AegisShield Payment Dashboard</h1><p>Demo UI. No real card data.</p></body></html>
