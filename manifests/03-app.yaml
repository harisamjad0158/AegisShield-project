apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aegis-app
  labels: {app.kubernetes.io/part-of: aegisshield}
spec:
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aegis-app
  labels: {app: frontend, app.kubernetes.io/part-of: aegisshield}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 1}}
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, tier: presentation, app.kubernetes.io/part-of: aegisshield}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginx:1.27.3-alpine
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: html, mountPath: /usr/share/nginx/html, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: nginx-conf, configMap: {name: frontend-config}}
        - {name: html, configMap: {name: frontend-html}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: aegis-app
  labels: {app.kubernetes.io/part-of: aegisshield}
spec:
  selector: {app: payment-api}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: aegis-app
  labels: {app: payment-api, app.kubernetes.io/part-of: aegisshield}
spec:
  replicas: 3
  selector:
    matchLabels: {app: payment-api}
  template:
    metadata:
      labels: {app: payment-api, tier: core-application, app.kubernetes.io/part-of: aegisshield}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.example.com/aegisshield/payment-api:1.0.0 # REPLACE with built and verified image digest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: DB_HOST, value: postgres.aegis-data.svc.cluster.local}
            - {name: DB_PORT, value: '5432'}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: api-db-credentials, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: api-db-credentials, key: password}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe: {httpGet: {path: /health/startup, port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
