name: AegisShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            payment-api/requirements.txt
            payment-api/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r payment-api/requirements-test.txt

      - name: Run pytest
        working-directory: payment-api
        run: python -m pytest tests/ -v

  security:
    name: Python Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit

      - name: Audit production dependencies
        run: |
          pip-audit -r payment-api/requirements.txt

      - name: Run Bandit
        run: |
          bandit -r payment-api -x payment-api/tests -ll

  helm:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Helm lint
        run: |
          helm lint charts/aegisshield

      - name: Render development manifests
        run: |
          helm template aegisshield charts/aegisshield \
            -f charts/aegisshield/values-dev.yaml \
            > /tmp/aegisshield-dev.yaml

      - name: Render production manifests
        run: |
          helm template aegisshield charts/aegisshield \
            -f charts/aegisshield/values-prod.yaml \
            > /tmp/aegisshield-prod.yaml

  container-security:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Payment API image
        run: |
          docker build \
            -t aegisshield/payment-api:ci \
            payment-api

      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aegisshield/payment-api:ci
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.txt
          if-no-files-found: warn
