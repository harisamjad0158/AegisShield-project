apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: aegis-edge
spec:
  type: ClusterIP
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: aegis-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4180

          envFrom:
            - secretRef:
                name: oauth2-proxy-credentials

          args:
            - --provider=oidc
            - --oidc-issuer-url=https://aegis.example.com:18443/auth/realms/aegisshield
            - --skip-oidc-discovery=true
            - --login-url=https://aegis.example.com:18443/auth/realms/aegisshield/protocol/openid-connect/auth
            - --redeem-url=http://keycloak.aegis-edge.svc.cluster.local:8080/auth/realms/aegisshield/protocol/openid-connect/token
            - --oidc-jwks-url=http://keycloak.aegis-edge.svc.cluster.local:8080/auth/realms/aegisshield/protocol/openid-connect/certs
            - --redirect-url=https://aegis.example.com:18443/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --upstream=static://200
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --scope=openid profile email
            - --skip-provider-button=true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 15
            periodSeconds: 20
