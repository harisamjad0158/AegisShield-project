apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-keycloak
  namespace: aegis-edge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aegis.example.com
      secretName: aegis-edge-tls
  rules:
    - host: aegis.example.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
